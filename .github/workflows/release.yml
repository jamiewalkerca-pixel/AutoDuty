name: Build & Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Add Dalamud NuGet feed
        run: dotnet nuget add source --name goatcorp "https://goatcorp.github.io/dalamud-distrib/index.json"

      - name: Restore dependencies
        run: dotnet restore AutoDuty/AutoDuty.csproj

      - name: Build
        run: dotnet build AutoDuty/AutoDuty.csproj --configuration Release --no-restore

      - name: Find zip output
        run: find AutoDuty/bin -name "*.zip" 2>/dev/null || echo "No zip found"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: AutoDuty/bin/Release/AutoDuty/latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
